[package]
name = "voice-receive"
version = "0.1.0"
edition = "2024"

[dependencies]
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "cache", "voice"] }
songbird = { version = "0.6.1", features = ["receive", "driver", "gateway", "serenity"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
